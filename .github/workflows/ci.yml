name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:  # release.yml re-runs these checks before it publishes

permissions:
  contents: read

jobs:
  validate:
    name: Validate the canonical conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest's system Python is PEP 668 "externally managed": pip needs its own interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every fixture, schema and the manifest is valid JSON
        run: |
          set -e
          for f in manifest.json schema/*.json fixtures/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "✓ all JSON files parse"

      - name: Manifest is internally consistent
        run: |
          python3 - <<'PY'
          import json, os, sys

          manifest = json.load(open("manifest.json"))
          assert manifest.get("schema_version") == 1, "manifest.schema_version must be 1"

          cases = manifest.get("cases", [])
          assert cases, "manifest has no cases"

          for case in cases:
              for key in ("name", "file", "valid"):
                  assert key in case, f"case {case.get('name')!r} missing '{key}'"
              path = case["file"]
              assert os.path.exists(path), f"case {case['name']!r} references missing file {path}"
              json.load(open(path))  # fixture parses
              if case["valid"]:
                  assert "expect" in case, f"valid case {case['name']!r} needs an 'expect' block"
              else:
                  assert "reason" in case, f"invalid case {case['name']!r} needs a 'reason'"

          print(f"✓ manifest consistent — {len(cases)} cases, all fixtures present")
          PY

      - name: CONFORMANCE_VERSION is a SemVer string
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' CONFORMANCE_VERSION \
            || { echo "CONFORMANCE_VERSION is not SemVer: $(cat CONFORMANCE_VERSION)"; exit 1; }
          echo "✓ CONFORMANCE_VERSION $(cat CONFORMANCE_VERSION)"

      - name: Install the reference JSON Schema validator
        run: python3 -m pip install --quiet "jsonschema>=4,<5"

      - name: Behaviour sections agree with the envelope schema
        run: |
          python3 - <<'PY'
          import json, os
          from jsonschema import Draft7Validator

          manifest = json.load(open("manifest.json"))
          envelope = Draft7Validator(json.load(open("schema/message-envelope.schema.json")))

          def schema_valid(doc):
              return not list(envelope.iter_errors(doc))

          def resolve(doc, pointer):
              # RFC 6901; returns (found, value)
              node = doc
              for raw in pointer.split("/")[1:]:
                  key = raw.replace("~1", "/").replace("~0", "~")
                  if isinstance(node, dict) and key in node:
                      node = node[key]
                  elif isinstance(node, list) and key.isdigit() and int(key) < len(node):
                      node = node[int(key)]
                  else:
                      return False, None
              return True, node

          def same(a, b):
              # JSON equality with type distinction (True != 1, {} != [])
              return json.dumps(a, sort_keys=True) == json.dumps(b, sort_keys=True)

          def fixture(case):
              path = case["file"]
              assert os.path.exists(path), f"{case['name']!r} references missing file {path}"
              return json.load(open(path))

          ASCII_BLANK = " \t\n\v\f\r"  # the only whitespace that counts as blank (ADR-0031 (c)); U+2003/U+00A0 are not

          def normalise(doc):
              # Reference oracle for the decode-time `urn` rule (ADR-0031 (c)): a missing/empty/ASCII-blank
              # `job` falls back to `urn`; top-level `urn` is never kept. The re-emit is checked against this.
              out = dict(doc)
              job = out.get("job")
              blank = not isinstance(job, str) or all(c in ASCII_BLANK for c in job)
              if blank and isinstance(out.get("urn"), str):
                  out["job"] = out["urn"]
              out.pop("urn", None)
              return out

          total = 0

          for case in manifest["roundtrip"]["cases"]:
              for key in ("name", "file", "expect_attempts", "expect_preserved"):
                  assert key in case, f"roundtrip {case.get('name')!r} missing '{key}'"
              doc = fixture(case)
              if case.get("producer_schema_valid", True):
                  assert schema_valid(doc), f"roundtrip {case['name']!r} must pass the envelope schema"
              else:
                  assert not schema_valid(doc), f"roundtrip {case['name']!r} is flagged producer_schema_valid:false but passes the schema"
              assert case["expect_attempts"] == doc["attempts"] + 1, f"roundtrip {case['name']!r}: expect_attempts must be attempts+1"
              reemit = normalise(doc)
              for pointer, value in case["expect_preserved"].items():
                  found, actual = resolve(reemit, pointer)
                  assert found and same(actual, value), f"roundtrip {case['name']!r}: {pointer} not in the re-emitted fixture with that value"
              # No roundtrip fixture may carry a forbidden key or both a non-blank job and a urn: the
              # manifest tells runners that decoding emits no warning.
              meta = doc.get("meta", {})
              assert not ({"timestamp"} & set(doc)) and not ({"max_retries", "attempts", "source", "ts"} & set(meta)), \
                  f"roundtrip {case['name']!r}: fixture carries a forbidden key, decode would warn"
              assert not ("urn" in doc and not all(c in ASCII_BLANK for c in str(doc.get("job", "")))), \
                  f"roundtrip {case['name']!r}: fixture carries both a non-blank job and urn, decode would warn"
              if "apply_dead_letter" in case:
                  applied = case["apply_dead_letter"]
                  assert set(applied) == {"reason", "original_queue"}, f"roundtrip {case['name']!r}: apply_dead_letter needs exactly reason + original_queue"
                  assert applied["reason"] in ("failed", "unknown_urn", "poison"), f"roundtrip {case['name']!r}: bad dead_letter reason"
                  assert isinstance(applied["original_queue"], str) and applied["original_queue"], f"roundtrip {case['name']!r}: bad original_queue"
                  assert "dead_letter" not in doc, f"roundtrip {case['name']!r}: fixture must not already carry a dead_letter block"
                  assert isinstance(case.get("expect_dead_letter"), dict) and case["expect_dead_letter"], f"roundtrip {case['name']!r}: apply_dead_letter needs expect_dead_letter"
                  # Reference DLQ move: the original envelope verbatim plus the dead_letter block (error-handling.md section 6).
                  dlq = dict(reemit)
                  dlq["dead_letter"] = {"reason": applied["reason"], "original_queue": applied["original_queue"]}
                  for pointer, value in case["expect_preserved"].items():
                      found, actual = resolve(dlq, pointer)
                      assert found and same(actual, value), f"roundtrip {case['name']!r}: {pointer} not in the dead-letter copy with that value"
                  for field, value in case["expect_dead_letter"].items():
                      assert field in dlq["dead_letter"] and same(dlq["dead_letter"][field], value), f"roundtrip {case['name']!r}: dead_letter.{field} mismatch"
              else:
                  assert "expect_dead_letter" not in case, f"roundtrip {case['name']!r}: expect_dead_letter without apply_dead_letter"
              for pointer in case.get("expect_absent_after_reencode", []):
                  assert not resolve(reemit, pointer)[0], f"roundtrip {case['name']!r}: {pointer} must be absent after re-encode"
              total += 1

          for case in manifest["data_shape"]["cases"]:
              assert case.get("mode") in ("encode", "decode"), f"data_shape {case.get('name')!r} needs mode encode|decode"
              if case["mode"] == "encode":
                  for key in ("urn", "queue", "data", "expect_encoded_data_json"):
                      assert key in case, f"data_shape {case['name']!r} missing '{key}'"
                  assert isinstance(case["data"], dict), f"data_shape {case['name']!r}: data must be an object"
                  assert same(json.loads(case["expect_encoded_data_json"]), case["data"]), f"data_shape {case['name']!r}: expected JSON disagrees with data"
              else:
                  for key in ("file", "valid", "reason"):
                      assert key in case, f"data_shape {case['name']!r} missing '{key}'"
                  assert schema_valid(fixture(case)) == case["valid"], f"data_shape {case['name']!r}: schema verdict != valid"
              total += 1

          for case in manifest["forbidden_keys"]["cases"]:
              for key in ("name", "file", "forbidden_key", "expect", "expect_absent_after_reencode"):
                  assert key in case, f"forbidden_keys {case.get('name')!r} missing '{key}'"
              assert case["expect"] == "warn", f"forbidden_keys {case['name']!r}: R0 policy is warn (K-15)"
              doc = fixture(case)
              assert schema_valid(doc), f"forbidden_keys {case['name']!r} must still pass the envelope schema"
              assert resolve(doc, case["forbidden_key"])[0], f"forbidden_keys {case['name']!r}: fixture lacks {case['forbidden_key']}"
              assert case["forbidden_key"] in case["expect_absent_after_reencode"]
              reemit = normalise(doc)
              for pointer, value in case.get("expect_preserved", {}).items():
                  found, actual = resolve(reemit, pointer)
                  assert found and same(actual, value), f"forbidden_keys {case['name']!r}: {pointer} not in the re-emitted fixture with that value"
              if case["forbidden_key"] == "/urn":
                  assert not resolve(reemit, "/urn")[0]
              total += 1

          CORE_META = {"id", "queue", "lang", "schema_version", "created_at"}  # ADR-0031 (b)
          FORBIDDEN_META = {"max_retries", "attempts", "source", "ts"}  # message-envelope.md section 10

          section = manifest["extension_write"]
          for case in section["cases"]:
              for key in ("name", "urn", "queue", "data", "meta", "expect_envelope"):
                  assert key in case, f"extension_write {case.get('name')!r} missing '{key}'"
              assert isinstance(case["data"], dict) and isinstance(case["meta"], dict) and case["meta"], f"extension_write {case['name']!r}: data and meta must be objects, meta non-empty"
              assert not (set(case["meta"]) & (CORE_META | FORBIDDEN_META)), f"extension_write {case['name']!r}: meta uses a reserved key"
              # reference model of the producer output: core keys + the meta entries
              out = {
                  "job": case["urn"], "data": case["data"], "attempts": 0,
                  "meta": {"queue": case["queue"], "lang": "php", "schema_version": 1, **case["meta"]},
              }
              for pointer, value in case["expect_envelope"].items():
                  found, actual = resolve(out, pointer)
                  assert found and same(actual, value), f"extension_write {case['name']!r}: {pointer} not produced by the reference model"
              total += 1

          section = manifest["encode_reject"]
          for case in section["cases"]:
              for key in ("name", "urn", "queue", "data", "expect", "offending_key"):
                  assert key in case, f"encode_reject {case.get('name')!r} missing '{key}'"
              assert case["expect"] == "reject", f"encode_reject {case['name']!r}: expect must be 'reject'"
              inputs = [k for k in ("meta", "meta_entries", "extras_top", "extras_meta") if k in case]
              assert len(inputs) == 1, f"encode_reject {case['name']!r}: exactly one input field, got {inputs}"
              if "meta_entries" in case:
                  keys = [e[0] for e in case["meta_entries"]]
                  assert len(keys) != len(set(keys)), f"encode_reject {case['name']!r}: meta_entries must repeat a key"
                  rejected = True
              elif "meta" in case:
                  rejected = bool(set(case["meta"]) & (CORE_META | FORBIDDEN_META))
              elif "extras_meta" in case:
                  rejected = bool(set(case["extras_meta"]) & (CORE_META | FORBIDDEN_META))
              else:
                  rejected = bool(set(case["extras_top"]) & {"timestamp", "urn"})
              assert rejected, f"encode_reject {case['name']!r}: input does not hit a rejected key set"
              total += 1

          section = manifest["payload_schema_unicode"]
          validator = Draft7Validator(section["schema"])  # Python len() counts code points
          for case in section["cases"]:
              verdict = not list(validator.iter_errors(case["data"]))
              assert verdict == case["valid"], f"payload_schema_unicode {case['name']!r}: reference verdict {verdict} != {case['valid']}"
              total += 1

          print(f"✓ behaviour sections consistent — {total} cases")
          PY

      - name: Broker schema_version_gate tables are well-formed
        run: |
          python3 - <<'PY'
          import json, os
          from jsonschema import Draft7Validator

          manifest = json.load(open("manifest.json"))
          envelope = Draft7Validator(json.load(open("schema/message-envelope.schema.json")))

          # broker -> native property carrying the schema version (Artemis uses underscores, ADR-0017)
          BROKERS = {
              "sqs": "bq-schema-version",
              "asb": "bq-schema-version",
              "pulsar": "bq-schema-version",
              "kafka": "bq-schema-version",
              "artemis": "bq_schema_version",
          }
          NUMERIC_BROKERS = {"asb"}  # AMQP-typed numeric property values are only meaningful on ASB
          NULL_BROKERS = {"asb", "kafka", "artemis"}  # SQS and Pulsar cannot carry a present-but-null property
          ASCII_BLANK = " \t\n\v\f\r"  # the only whitespace that counts as blank; never trimmed

          def oracle(value):
              # Reference gate (broker-bindings.md §3.7/§4.7/§5.7/§6.7/§7.7): blank falls through to decode,
              # exactly "1" decodes, everything else is rejected without decoding.
              if isinstance(value, str):
                  return "decode" if (all(c in ASCII_BLANK for c in value) or value == "1") else "reject"
              return "decode" if value == 1 else "reject"

          REQUIRED = [  # cases every broker table must lock
              {"absent": True}, {"value": ""}, {"value": " "}, {"value": "1"},
              {"value": "2"}, {"value": " 1"}, {"value": "1 "},
              {"value": "\u00a0"}, {"value": "\u0085"}, {"value": "\u3000"}, {"value": "\ufeff"},
          ]

          total = 0
          for broker, prop in BROKERS.items():
              block = manifest.get(broker)
              assert isinstance(block, dict), f"manifest.{broker} block missing"
              gate = block.get("schema_version_gate")
              assert isinstance(gate, dict), f"{broker}: schema_version_gate missing"
              assert set(gate) == {"description", "property", "fixture", "cases"}, f"{broker}: unexpected gate keys {sorted(gate)}"
              assert isinstance(gate["description"], str) and gate["description"].strip(), f"{broker}: description must be a non-empty string"
              assert gate["property"] == prop, f"{broker}: property must be {prop!r}, got {gate['property']!r}"
              assert os.path.exists(gate["fixture"]), f"{broker}: fixture {gate['fixture']} does not exist"
              assert not list(envelope.iter_errors(json.load(open(gate["fixture"])))), f"{broker}: fixture {gate['fixture']} must pass the envelope schema"

              cases = gate["cases"]
              assert isinstance(cases, list) and cases, f"{broker}: cases must be a non-empty list"
              seen = set()
              for case in cases:
                  assert isinstance(case, dict), f"{broker}: case must be an object: {case!r}"
                  keys = set(case)
                  assert keys in ({"value", "expect"}, {"value", "value_type", "expect"}, {"absent", "expect"}), f"{broker}: case needs 'expect' plus exactly one of 'value' or 'absent' (optional 'value_type' with 'value'): {case!r}"
                  assert case["expect"] in ("decode", "reject"), f"{broker}: expect must be decode|reject: {case!r}"
                  if "absent" in case:
                      assert case["absent"] is True, f"{broker}: 'absent' must be true: {case!r}"
                      ident = ("absent",)
                      want = "decode"
                  else:
                      value = case["value"]
                      if value is None:
                          # a present-but-null property (header) is treated exactly like an absent one (README)
                          assert broker in NULL_BROKERS, f"{broker}: null value only allowed on {sorted(NULL_BROKERS)}: {case!r}"
                          assert "value_type" not in case, f"{broker}: value_type does not apply to null: {case!r}"
                          ident = ("null",)
                          assert ident not in seen, f"{broker}: duplicate case {case!r}"
                          seen.add(ident)
                          assert case["expect"] == "decode", f"{broker}: {case!r} disagrees with the reference gate (expected decode)"
                          total += 1
                          continue
                      is_number = isinstance(value, (int, float)) and not isinstance(value, bool)
                      assert isinstance(value, str) or is_number, f"{broker}: value must be a string (or a number on {sorted(NUMERIC_BROKERS)}): {case!r}"
                      assert not is_number or broker in NUMERIC_BROKERS, f"{broker}: numeric value only allowed on {sorted(NUMERIC_BROKERS)}: {case!r}"
                      value_type = case.get("value_type")
                      # "float" marks a native floating-point value a JSON reader may not tell from an integer (README)
                      assert value_type in (None, "float"), f"{broker}: value_type must be 'float' when present: {case!r}"
                      assert value_type is None or is_number, f"{broker}: value_type only applies to a numeric value: {case!r}"
                      # an integral float (1.0) reads back as an int in most JSON readers, so it must carry the marker
                      assert not (isinstance(value, float) and value.is_integer()) or value_type == "float", f"{broker}: an integral float literal needs value_type 'float': {case!r}"
                      ident = (value_type or type(value).__name__, value)
                      want = "reject" if value_type == "float" else oracle(value)
                  assert ident not in seen, f"{broker}: duplicate case {case!r}"
                  seen.add(ident)
                  assert case["expect"] == want, f"{broker}: {case!r} disagrees with the reference gate (expected {want})"
                  total += 1

              for req in REQUIRED:
                  ident = ("absent",) if "absent" in req else ("str", req["value"])
                  assert ident in seen, f"{broker}: required gate case missing: {req!r}"
              if broker in NUMERIC_BROKERS:
                  for n in (1, 2):  # ASB must lock the AMQP-numeric accept (1) and reject (2) cases
                      assert ("int", n) in seen, f"{broker}: numeric case {n} missing"
                  assert ("float", 1.0) in seen, f"{broker}: float case 1.0 missing"
              if broker in NULL_BROKERS:
                  assert ("null",) in seen, f"{broker}: null case missing"

          print(f"✓ schema_version_gate tables well-formed — {len(BROKERS)} brokers, {total} cases")
          PY

      - name: Manifest sections map, exceptions and version are consistent
        run: |
          python3 - <<'PY'
          import json, re

          manifest = json.load(open("manifest.json"))
          version = open("CONFORMANCE_VERSION").read().strip()
          assert manifest.get("conformance_version") == version, \
              f"manifest.conformance_version {manifest.get('conformance_version')!r} != CONFORMANCE_VERSION {version!r}"

          META_KEYS = {"schema_version", "description", "conformance_version", "sections", "exceptions"}
          SCOPES = {"core", "redis", "amqp", "sqs", "asb", "pulsar", "kafka", "artemis", "otel"}
          BINDINGS = SCOPES - {"core"}

          sections = manifest["sections"]
          declared = {k for k in manifest if k not in META_KEYS}
          assert set(sections) == declared, \
              f"sections map and manifest sections differ: only in map {sorted(set(sections) - declared)}, only in manifest {sorted(declared - set(sections))}"
          for name, entry in sections.items():
              assert set(entry) == {"scope"} and entry["scope"] in SCOPES, f"sections.{name}: needs exactly a valid 'scope', got {entry!r}"
          assert sections["rabbitmq"]["scope"] == "amqp", "the rabbitmq section's scope is amqp"
          for name in ("trim", "job_type"):
              assert sections[name]["scope"] == "core", f"sections.{name}: expected scope core"
          assert sections["traceparent"]["scope"] == "otel", "sections.traceparent: expected scope otel (ADR-0032 section 2)"

          exceptions = manifest["exceptions"]
          assert isinstance(exceptions, list), "exceptions must be a list"
          for exc in exceptions:
              assert set(exc) == {"family", "binding", "adr"}, f"exception needs family, binding, adr: {exc!r}"
              assert isinstance(exc["family"], str) and exc["family"], f"exception family: {exc!r}"
              assert exc["binding"] in BINDINGS, f"exception binding: {exc!r}"
              assert re.fullmatch(r"ADR-[0-9]{4}", exc["adr"]), f"exception adr: {exc!r}"
          assert {"family": "php", "binding": "asb", "adr": "ADR-0021"} in exceptions, "PHP x ASB (ADR-0021) exception missing"

          print(f"✓ conformance_version {version}, sections map covers {len(sections)} sections, {len(exceptions)} exception(s)")
          PY

      - name: v1.5 sections agree with their reference oracles
        run: |
          python3 - <<'PY'
          import json, os, re

          manifest = json.load(open("manifest.json"))
          ASCII_BLANK = " \t\n\v\f\r"

          def is_blank(value):
              return all(c in ASCII_BLANK for c in value)

          def resolve(doc, pointer):
              node = doc
              for raw in pointer.split("/")[1:]:
                  key = raw.replace("~1", "/").replace("~0", "~")
                  if isinstance(node, dict) and key in node:
                      node = node[key]
                  else:
                      return False, None
              return True, node

          def same(a, b):
              return json.dumps(a, sort_keys=True) == json.dumps(b, sort_keys=True)

          def names_unique(section, cases):
              names = [c["name"] for c in cases]
              assert len(names) == len(set(names)), f"{section}: duplicate case names"

          def load(case, section):
              assert os.path.exists(case["file"]), f"{section} {case['name']!r}: missing file {case['file']}"
              return json.load(open(case["file"]))

          def decode(doc):
              # Reference oracle for ADR-0032 section 6 (+ ADR-0031): returns (urn or None, warns)
              job, urn = doc.get("job"), doc.get("urn")
              warns = "job" in doc and not isinstance(job, str)
              if isinstance(job, str) and not is_blank(job):
                  assert "urn" not in doc, "fixture carries both a non-blank job and a urn (ADR-0031 warn case belongs to roundtrip)"
                  return job, warns
              if isinstance(urn, str) and not is_blank(urn):
                  return urn, warns
              return None, warns

          used = set()
          total = 0

          def check_decode(section, case):
              doc = load(case, section)
              used.add(case["file"])
              urn, warns = decode(doc)
              assert case["valid"] == (urn is not None), f"{section} {case['name']!r}: valid flag disagrees with the ADR-0032 oracle"
              if case["valid"]:
                  assert case["expect"] == {"urn": urn}, f"{section} {case['name']!r}: expect.urn disagrees with the oracle ({urn!r})"
                  assert case["expect_warning"] is warns, f"{section} {case['name']!r}: expect_warning disagrees with the oracle ({warns})"
              else:
                  assert "reason" in case and "expect" not in case, f"{section} {case['name']!r}: an invalid case needs a reason and no expect"

          # ---- trim -------------------------------------------------------------------
          trim = manifest["trim"]["cases"]
          names_unique("trim", trim)
          modes = set()
          for case in trim:
              mode = case["mode"]
              modes.add(mode)
              if mode == "make":
                  stripped = case["urn"].strip(ASCII_BLANK)
                  if case["expect"] == "reject":
                      assert stripped == "", f"trim {case['name']!r}: only an empty-after-trim URN is rejected"
                  else:
                      assert set(case["expect"]) <= {"job", "trace_id"}, f"trim {case['name']!r}: bad expect"
                      assert case["expect"]["job"] == stripped, f"trim {case['name']!r}: job must be the ASCII-trimmed urn"
                      if "trace_id" in case:
                          assert case["expect"].get("trace_id") == case["trace_id"].strip(ASCII_BLANK), f"trim {case['name']!r}: trace_id must be ASCII-trimmed"
              elif mode == "decode":
                  check_decode("trim", case)
              elif mode == "accepts":
                  doc = load(case, "trim")
                  used.add(case["file"])
                  tid = doc.get("trace_id")
                  assert case["expect_accepts"] is (isinstance(tid, str) and not is_blank(tid)), f"trim {case['name']!r}: expect_accepts disagrees with the blank rule"
                  assert case["expect_decode_ok"] is True and decode(doc)[0] is not None, f"trim {case['name']!r}: a blank trace_id must not make decode fail"
              elif mode == "reemit":
                  doc = load(case, "trim")
                  used.add(case["file"])
                  assert case["expect_attempts"] == doc["attempts"] + 1, f"trim {case['name']!r}: expect_attempts must be attempts+1"
                  assert case["expect_preserved"], f"trim {case['name']!r}: nothing preserved"
                  for pointer, value in case["expect_preserved"].items():
                      found, actual = resolve(doc, pointer)
                      assert found and same(actual, value), f"trim {case['name']!r}: {pointer} is not in the fixture with that value"
                  job = doc["job"]
                  assert not is_blank(job), f"trim {case['name']!r}: a re-emit fixture needs a non-blank job"
              else:
                  raise AssertionError(f"trim {case['name']!r}: unknown mode {mode!r}")
              total += 1
          assert modes == {"make", "decode", "accepts", "reemit"}, f"trim must exercise every mode, got {sorted(modes)}"

          # every ASCII-set member and every Unicode counter-example is covered
          text = json.dumps(trim)
          for escape in ("\\t", "\\n", "\\r", "\\f", "\\u000b", "\\u00a0", "\\u2003", "\\u3000"):
              assert escape in text, f"trim never uses {escape}"

          # ---- job_type ---------------------------------------------------------------
          job_type = manifest["job_type"]["cases"]
          names_unique("job_type", job_type)
          kinds = set()
          for case in job_type:
              check_decode("job_type", case)
              doc = json.load(open(case["file"]))
              if "job" in doc and not isinstance(doc["job"], str):
                  kinds.add(type(doc["job"]).__name__)
                  if case["valid"]:
                      assert case["expect_warning"] is True, f"job_type {case['name']!r}: a non-string job MUST warn"
              total += 1
          assert kinds >= {"NoneType", "int", "bool", "dict", "list"}, f"job_type must cover null/number/bool/object/array, got {sorted(kinds)}"

          for fx in sorted(os.listdir("fixtures")):
              if fx.startswith(("trim-", "job-type-")):
                  assert f"fixtures/{fx}" in used, f"orphan fixture {fx}: not referenced by trim or job_type"

          # ---- delay (sqs section 3.4 / 3.5) -------------------------------------------
          delay = manifest["delay"]
          names_unique("delay", delay["cases"])
          for case in delay["cases"]:
              d = case["delay_seconds"]
              if case["queue_type"] == "fifo" or d > 900:
                  assert case["expect"] == "reject", f"delay {case['name']!r}: >900 s and FIFO per-message delay must reject"
              else:
                  assert case["expect"] == {"delay_seconds_attribute": d} and 0 < d <= 900, f"delay {case['name']!r}: DelaySeconds must equal the delay"
              total += 1
          assert {c["delay_seconds"] for c in delay["cases"] if c["queue_type"] == "standard"} >= {900, 901}, "delay must lock the 900/901 boundary"
          names_unique("delay.release_visibility", delay["release_visibility"]["cases"])
          for case in delay["release_visibility"]["cases"]:
              assert case["expect"] == {"visibility_timeout": case["delay_seconds"]} and 0 <= case["delay_seconds"] <= 43200, f"delay release {case['name']!r}"
              total += 1

          # ---- backoff (kafka section 6.4 / 6.5) ----------------------------------------
          backoff = manifest["backoff"]

          def tier_for(tiers, ms):
              fit = [t for t in sorted(tiers) if t >= ms]
              return fit[0] if fit else None

          names_unique("backoff", backoff["cases"])
          for case in backoff["cases"]:
              tiers = case["retry_tiers_ms"]
              assert tiers == sorted(tiers) and len(set(tiers)) == len(tiers), f"backoff {case['name']!r}: tiers must ascend"
              tier = tier_for(tiers, case["delay_ms"])
              if tier is None:
                  assert case["expect"] == "reject", f"backoff {case['name']!r}: no tier fits, must reject"
              else:
                  assert case["expect"] == {"tier_ms": tier, "headers": {"bq-delay": str(case["delay_ms"]), "bq-original-topic": case["work_topic"]}}, f"backoff {case['name']!r}: tier/headers disagree with section 6.4"
              total += 1
          names_unique("backoff.retry_republish", backoff["retry_republish"]["cases"])
          for case in backoff["retry_republish"]["cases"]:
              tiers = case["retry_tiers_ms"]
              if not tiers:
                  assert case["expect"] == "reject", f"retry_republish {case['name']!r}: must reject"
              else:
                  # section 6.5 retry rule: n = min(attempts_before, N-1) + 1, bq-delay is the tier's own delay
                  n = min(case["attempts"], len(tiers) - 1) + 1
                  want = {"n": n, "topic": f"{case['work_topic']}.retry.{n}", "tier_ms": tiers[n - 1],
                          "body_attempts": case["attempts"] + 1,
                          "headers": {"bq-attempts": str(case["attempts"] + 1), "bq-delay": str(tiers[n - 1]),
                                      "bq-original-topic": case["work_topic"]}}
                  assert case["expect"] == want, f"retry_republish {case['name']!r}: disagrees with section 6.5"
              assert "release_delay_ms" not in case, f"retry_republish {case['name']!r}: section 6.5 does not take a requested delay"
              total += 1

          # ---- traceparent (ADR-0028 / ADR-0025) ---------------------------------------
          TP = re.compile(r"^00-([0-9a-fA-F]{32})-([0-9a-fA-F]{16})-([0-9a-fA-F]{2})$")
          traceparent = manifest["traceparent"]
          names_unique("traceparent", traceparent["cases"])
          for case in traceparent["cases"]:
              assert case["mode"] == "extract"
              header = case["traceparent"]
              m = TP.match(header) if isinstance(header, str) else None
              if m:
                  want = {"source": "traceparent", "trace_id_hex": m.group(1), "parent_span_id": m.group(2), "flags": m.group(3)}
              else:
                  want = {"source": "trace_id", "trace_id_hex": case["trace_id"].replace("-", "")}
              assert case["expect"] == want, f"traceparent {case['name']!r}: disagrees with ADR-0028"
              total += 1
          assert set(traceparent) == {"description", "cases"}, "traceparent has only extract cases (out-of-band carriage is left to the R1 OTel plan)"

          # ---- redis_layout (broker-bindings section 1.1) ------------------------------
          redis_layout = manifest["redis_layout"]
          names_unique("redis_layout", redis_layout["cases"])
          for case in redis_layout["cases"]:
              q, p = case["queue"], case["key_prefix"]
              assert case["expect"] == {"ready": f"{p}{q}", "delayed": f"{p}{q}:delayed", "reserved": f"{p}{q}:reserved", "notify": f"{p}{q}:notify"}, f"redis_layout {case['name']!r}"
              total += 1

          # ---- nothing forbidden / no pre-existing expectation moved -------------------
          for fx in sorted(os.listdir("fixtures")):
              if fx.startswith(("trim-", "job-type-")):
                  doc = json.load(open(f"fixtures/{fx}"))
                  assert "timestamp" not in doc, f"{fx}: forbidden key"

          print(f"✓ v1.5 sections agree with their reference oracles — {total} cases")
          PY

      - name: v1.6 sections agree with their reference oracles
        run: |
          python3 - <<'PY'
          import json, math
          from fractions import Fraction

          manifest = json.load(open("manifest.json"))
          total = 0

          def names_unique(section, cases):
              names = [c["name"] for c in cases]
              assert len(names) == len(set(names)), f"{section}: duplicate case names"

          # ---- redis_delay (section 1.6): score = floor(now) + ceil(delay) ---------------
          redis_delay = manifest["redis_delay"]
          names_unique("redis_delay", redis_delay["cases"])
          for case in redis_delay["cases"]:
              want = math.floor(Fraction(repr(case["now"]))) + math.ceil(Fraction(repr(case["delay"])))
              assert case["expect_score"] == want, f"redis_delay {case['name']!r}: expect_score {case['expect_score']} != floor(now)+ceil(delay) = {want}"
              total += 1
          for case in manifest["redis_layout"]["delayed_score"]["cases"]:
              steps = [st for st in case["steps"] if st["op"] == "push_delayed"]
              assert steps, f"delayed_score {case['name']!r}: no push_delayed step"
              for st in steps:
                  want = math.floor(Fraction(repr(st["now"]))) + math.ceil(Fraction(repr(st["delay"])))
                  scores = [d["score"] for d in st["expect"]["delayed"]]
                  assert want in scores, f"delayed_score {case['name']!r}: expected score {want} not in {scores}"
              total += 1

          # ---- backoff: topic_names, retry_attempt_tier, default_tiers (section 6.4 / 6.5) -
          backoff = manifest["backoff"]
          names_unique("backoff.topic_names", backoff["topic_names"]["cases"])
          for case in backoff["topic_names"]["cases"]:
              assert case["expect_topic"] == f"{case['work_topic']}.retry.{case['n']}", f"topic_names {case['name']!r}"
              total += 1
          names_unique("backoff.retry_attempt_tier", backoff["retry_attempt_tier"]["cases"])
          for case in backoff["retry_attempt_tier"]["cases"]:
              tiers = case["retry_tiers_ms"]
              n = min(case["attempts_before"], len(tiers) - 1) + 1
              want = {"n": n, "topic": f"{case['work_topic']}.retry.{n}", "tier_ms": tiers[n - 1],
                      "body_attempts": case["attempts_before"] + 1,
                      "headers": {"bq-attempts": str(case["attempts_before"] + 1), "bq-delay": str(tiers[n - 1]),
                                  "bq-original-topic": case["work_topic"]}}
              if "key" in case:
                  want["key"] = case["key"]
              assert case["expect"] == want, f"retry_attempt_tier {case['name']!r}: disagrees with section 6.5"
              total += 1
          names_unique("backoff.default_tiers", backoff["default_tiers"]["cases"])
          for case in backoff["default_tiers"]["cases"]:
              assert case["expect"] == sorted(set(case["expect"])) and case["expect"] == [5000, 30000, 300000, 1800000], f"default_tiers {case['name']!r}"
              total += 1

          # ---- retry_backoff (ADR-0034 section 9): d(n) = min(max, base * mult^(n-1)) ----
          retry_backoff = manifest["retry_backoff"]
          assert "formula" not in manifest["backoff"], "the formula block moved to the core-scope retry_backoff section"
          names_unique("retry_backoff", retry_backoff["cases"])
          for case in retry_backoff["cases"]:
              d = Fraction(repr(case["retry_backoff"])) * Fraction(repr(case["retry_backoff_multiplier"])) ** (case["n"] - 1)
              cap = Fraction(repr(case["retry_backoff_max"]))
              if cap != 0:
                  d = min(cap, d)
              if case["retry_jitter"] == "none":
                  assert Fraction(repr(case["expect_delay_seconds"])) == d, f"retry_backoff {case['name']!r}: expect_delay_seconds != d(n) = {d}"
                  assert "expect_delay_range_seconds" not in case
              else:
                  rng = case["expect_delay_range_seconds"]
                  assert Fraction(repr(rng["min"])) == 0 and Fraction(repr(rng["max"])) == d, f"retry_backoff {case['name']!r}: range must be 0..d(n) = {d}"
                  assert "expect_delay_seconds" not in case
              total += 1

          # ---- redis_layout.migrate: notify count = members moved to ready ---------------
          # Every migrate/reserve-only case with a single step: moved = due delayed members
          # (score <= floor(now)) + due reserved members (only when retry_after is not null),
          # each set capped at migration_batch_size when the case sets one.
          migrate = manifest["redis_layout"]["migrate"]
          names_unique("redis_layout.migrate", migrate["cases"])
          for case in migrate["cases"]:
              assert len(case["steps"]) == 1, f"migrate {case['name']!r}: oracle models single-step cases"
              st, state = case["steps"][0], case["state"]
              floor_now = math.floor(Fraction(repr(st["now"])))
              batch = case.get("migration_batch_size", -1)
              def due(entries):
                  n = sum(1 for e in entries if e["score"] <= floor_now)
                  return n if batch < 0 else min(n, batch)
              delayed = state.get("delayed")
              delayed_n = state["delayed_generate"]["count"] if "delayed_generate" in state else len(delayed or [])
              delayed_entries = ([{"score": state["delayed_generate"]["score"]}] * delayed_n) if "delayed_generate" in state else (delayed or [])
              moved_delayed = due(delayed_entries)
              moved_reserved = due(state.get("reserved", [])) if case["retry_after"] is not None else 0
              moved = moved_delayed + moved_reserved
              ex = st["expect"]
              popped = 1 if st["op"] == "reserve" and ex.get("outcome") == "delivered" else 0
              assert st["op"] in ("migrate", "reserve"), f"migrate {case['name']!r}: unexpected op"
              assert ex["notify"] == state.get("notify", 0) + moved - popped, f"migrate {case['name']!r}: notify {ex['notify']} != {state.get('notify', 0)} + {moved} - {popped}"
              ready_after = ex["ready_generate"]["count"] if "ready_generate" in ex else len(ex["ready"])
              ready_before = len(state.get("ready", []))
              assert ready_after == ready_before + moved - popped, f"migrate {case['name']!r}: ready count disagrees with {moved} moved"
              assert len(ex.get("delayed", delayed_entries)) == delayed_n - moved_delayed, f"migrate {case['name']!r}: delayed remainder disagrees"
              total += 1

          # ---- redis_layout.pcall_poison: encode-fails-* (ADR-0033 A1 second pcall) -------
          # The body must decode (attempts is a number) and carry a non-finite number literal
          # that cjson.decode accepts and cjson.encode refuses; the poison result is the raw body.
          import base64, decimal, re
          pcall_cases = manifest["redis_layout"]["pcall_poison"]["cases"]
          names_unique("redis_layout.pcall_poison", pcall_cases)
          for case in pcall_cases:
              if not case["name"].startswith("encode-fails-"):
                  continue
              body = case["state"]["ready"][0]
              ex = case["steps"][0]["expect"]
              assert len(case["state"]["ready"]) == 1 and len(case["steps"]) == 1, f"pcall_poison {case['name']!r}: single body, single step"
              assert re.search(r'"n":(1e400|-1e400|NaN|Infinity)\}', body), f"pcall_poison {case['name']!r}: body lacks a non-finite number literal"
              assert re.search(r'"attempts":\d+', body), f"pcall_poison {case['name']!r}: attempts must be a number so only the re-encode can fail"
              assert ex["outcome"] == "poison" and ex["handler_body"] == body, f"pcall_poison {case['name']!r}: handler_body must be the raw body"
              assert ex["reserved"] == [{"member": body, "score": 1000 + case["retry_after"]}] and ex["ready"] == [], f"pcall_poison {case['name']!r}: raw body must sit in :reserved"
              total += 1

          # ---- poison_dlq (ADR-0035): independent reference for the record shape ----------
          def reject_constant(name):
              raise ValueError(f"non-JSON literal {name}")

          def has_lone_surrogate(value):
              # json.loads turns a paired escape into one code point and leaves a lone one as U+D800..U+DFFF;
              # iterative so a deeply nested body cannot hit the recursion limit
              stack = [value]
              while stack:
                  v = stack.pop()
                  if isinstance(v, str):
                      if any(0xD800 <= ord(ch) <= 0xDFFF for ch in v):
                          return True
                  elif isinstance(v, list):
                      stack.extend(v)
                  elif isinstance(v, dict):
                      stack.extend(v.keys())
                      stack.extend(v.values())
              return False

          class Obj(dict):
              dup = False

          def lossy_number_kind(literal, is_int):
              # which way a JSON number literal is lost by a re-encoding writer's own number type
              # (int64 / IEEE double), or None when it survives; checked on the literal text;
              # an integer past 2^53 is lost by a double-only writer (Node) even inside int64
              if is_int:
                  digits = literal.lstrip("-")
                  if len(digits) > 19 or not -(2 ** 63) <= int(literal) <= 2 ** 63 - 1:
                      return "int64"
                  if abs(int(literal)) > 2 ** 53:
                      return "int53"
                  return None
              exact = decimal.Decimal(literal)
              as_float = float(literal)
              if math.isinf(as_float):
                  return "overflow"
              if as_float == 0.0 and exact != 0:
                  return "underflow"
              if decimal.Decimal(repr(as_float)) != exact:
                  return "decimal"
              return None

          def parse_tracking_duplicates(text):
              # strict parse that remembers whether any object, at any depth, repeats a member name and
              # which kinds of lossy number the body holds;
              # returns (decoded, repeated_anywhere, lossy_kinds); the top-level object also carries .dup
              seen = []
              lossy = set()

              def parse_int(s):
                  kind = lossy_number_kind(s, True)
                  if kind:
                      lossy.add(kind)
                  return int(s) if kind is None else 0

              def parse_float(s):
                  kind = lossy_number_kind(s, False)
                  if kind:
                      lossy.add(kind)
                  return float(s)

              def hook(pairs):
                  o = Obj(pairs)
                  o.dup = len(o) != len(pairs)
                  if o.dup:
                      seen.append(o)
                  return o

              decoded = json.loads(text, parse_constant=reject_constant, object_pairs_hook=hook,
                                   parse_int=parse_int, parse_float=parse_float)
              return decoded, bool(seen), lossy

          # ADR-0035 section 1 leaves depth/resource limits to the writer (PHP's default json nesting limit is 512);
          # a body nested deeper than this threshold is therefore never plain `splice`, always splice_or_wrapper
          DEPTH_LIMIT = 512

          def nesting_depth(value):
              # max container (object/array) nesting, the top-level container being depth 1;
              # iterative so a deeply nested body cannot hit the recursion limit
              best = 0
              stack = [(value, 1)]
              while stack:
                  v, d = stack.pop()
                  if isinstance(v, dict):
                      best = max(best, d)
                      stack.extend((c, d + 1) for c in v.values())
                  elif isinstance(v, list):
                      best = max(best, d)
                      stack.extend((c, d + 1) for c in v)
              return best

          def poison_record(raw):
              # strict RFC 8259 object (ADR-0035 section 1): NaN/Infinity/-Infinity and unpaired
              # surrogate escapes are not an object, so they are wrapped
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  return {"raw": base64.b64encode(raw).decode("ascii"), "raw_encoding": "base64"}, "wrapper"
              try:
                  decoded, _, _ = parse_tracking_duplicates(text)
              except (ValueError, RecursionError):
                  decoded = None
              if isinstance(decoded, dict) and has_lone_surrogate(decoded):
                  decoded = None
              if isinstance(decoded, dict) and "dead_letter" not in decoded:
                  return decoded, "splice"
              return {"raw": text}, "wrapper"

          poison_dlq = manifest["poison_dlq"]
          assert manifest["sections"]["poison_dlq"]["scope"] == "core"
          names_unique("poison_dlq", poison_dlq["cases"])
          shapes = set()
          dup_kinds = set()
          lossy_kinds = set()
          deep_seen = False
          for case in poison_dlq["cases"]:
              assert ("body" in case) != ("body_base64" in case), f"poison_dlq {case['name']!r}: exactly one of body / body_base64"
              raw = case["body"].encode("utf-8") if "body" in case else base64.b64decode(case["body_base64"], validate=True)
              if "body_base64" in case:
                  assert base64.b64encode(raw).decode("ascii") == case["body_base64"], f"poison_dlq {case['name']!r}: body_base64 must be canonical padded base64"
                  try:
                      raw.decode("utf-8")
                      raise AssertionError(f"poison_dlq {case['name']!r}: body_base64 is for bodies that are NOT valid UTF-8")
                  except UnicodeDecodeError:
                      pass
              want, shape = poison_record(raw)
              ex = case["expect"]
              repeated = False
              if shape == "splice":
                  # a repeated member name cannot survive a re-encode (RFC 8259 section 4 only says SHOULD be
                  # unique, parsers keep the last): such a body is splice_or_wrapper, never plain splice
                  _, repeated, lossy = parse_tracking_duplicates(raw.decode("utf-8"))
                  top_repeated = want.dup
                  # a number the writer's own number type cannot carry (overflow to inf, underflow to 0,
                  # integer beyond int64 or beyond 2^53 for a double-only writer, decimal beyond double
                  # precision) cannot survive a re-encode either
                  if lossy:
                      assert ex["shape"] == "splice_or_wrapper", f"poison_dlq {case['name']!r}: a body with a lossy number ({sorted(lossy)}) must be splice_or_wrapper"
                  lossy_kinds |= lossy
                  if repeated:
                      assert ex["shape"] == "splice_or_wrapper", f"poison_dlq {case['name']!r}: a body with a repeated member name must be splice_or_wrapper"
                  dup_kinds.add(("top" if top_repeated else "nested") if repeated else "none")
                  # a body past the depth threshold may be wrapped by a depth-limited writer (PHP), so a
                  # plain `splice` expectation would reject a conformant writer
                  if nesting_depth(want) > DEPTH_LIMIT:
                      assert ex["shape"] == "splice_or_wrapper", f"poison_dlq {case['name']!r}: a body nested deeper than {DEPTH_LIMIT} must be splice_or_wrapper"
                      deep_seen = True
              lits = ex.get("splice_literals")
              if ex["shape"] == "splice_or_wrapper":
                  # a strict object a re-encoding writer cannot carry losslessly: byte-level splice
                  # (every literal verbatim) or the wrapper, never a re-encoded copy
                  assert shape == "splice", f"poison_dlq {case['name']!r}: splice_or_wrapper is only for strict objects"
                  assert lits and all(isinstance(l, str) and l and l in case["body"] for l in lits), f"poison_dlq {case['name']!r}: splice_literals must be non-empty and occur verbatim in body"
                  assert ex["record"] == {"raw": case["body"]}, f"poison_dlq {case['name']!r}: record must be the wrapper"
                  # splice_keys pin the structural check of a byte-level splice: the distinct top-level member
                  # names of the body (other than dead_letter), compared as a set; repeats collapse
                  top_keys = set(want.keys()) - {"dead_letter"}
                  keys = ex.get("splice_keys")
                  assert isinstance(keys, list) and len(keys) == len(set(keys)) and set(keys) == top_keys, f"poison_dlq {case['name']!r}: splice_keys must list each distinct top-level member name of the body once ({sorted(top_keys)})"
                  assert not {"raw", "raw_encoding", "dead_letter"} & set(top_keys), f"poison_dlq {case['name']!r}: splice_keys must not collide with raw / raw_encoding / dead_letter"
                  if repeated:
                      assert len(lits) >= 2, f"poison_dlq {case['name']!r}: a repeated-member case pins every repeated member text"
                  shape = "splice_or_wrapper"
              else:
                  assert lits is None and "splice_keys" not in ex, f"poison_dlq {case['name']!r}: splice_literals / splice_keys only belong to splice_or_wrapper"
                  assert ex["record"] == want, f"poison_dlq {case['name']!r}: record disagrees with ADR-0035"
              assert ex["shape"] == shape, f"poison_dlq {case['name']!r}: shape {ex['shape']} != {shape}"
              assert "dead_letter" not in ex["record"], f"poison_dlq {case['name']!r}: the record is the body without dead_letter"
              if "raw_encoding" in ex["record"]:
                  assert ex["record"]["raw_encoding"] == "base64", f"poison_dlq {case['name']!r}: writers never emit utf8"
              shapes.add((shape, "raw_encoding" in ex["record"]))
              total += 1
          assert shapes == {("splice", False), ("splice_or_wrapper", False), ("wrapper", False), ("wrapper", True)}, f"poison_dlq: every record shape must be covered, got {shapes}"
          # the strict-object rule is pinned for each non-JSON literal, each unpaired surrogate form,
          # and the bodies of the redis encode-fails-* cases reach the DLQ record as well
          bodies = {c.get("body") for c in poison_dlq["cases"]}
          for pc in pcall_cases:
              if pc["name"].startswith("encode-fails-"):
                  assert pc["state"]["ready"][0] in bodies, f"poison_dlq: encode-fails body of {pc['name']!r} must also be a poison_dlq case"
          assert lossy_kinds >= {"overflow", "underflow", "int64", "decimal"}, f"poison_dlq: lossy-number cases must cover overflow, underflow, int64 and decimal, got {sorted(lossy_kinds)}"
          assert dup_kinds == {"none", "top", "nested"}, f"poison_dlq: repeated-member cases must cover a top-level and a nested repeat, got {dup_kinds}"
          assert deep_seen, f"poison_dlq: a strict-object case nested deeper than {DEPTH_LIMIT} must exist"
          for lit in ("NaN", "Infinity", "-Infinity"):
              # bounded match: a plain substring test would let a -Infinity body satisfy the Infinity requirement
              lit_re = re.compile(r'[:,\[]\s*' + re.escape(lit) + r'(?![\w.])')
              assert any(lit_re.search(b) and c["expect"]["shape"] == "wrapper" for c in poison_dlq["cases"] if (b := c.get("body"))), f"poison_dlq: no wrapper case for {lit}"
          for esc in ("\\ud800\"", "\\udc00", "\\ud800\\u0041", "\\ud800\":"):
              assert any(esc in b and c["expect"]["shape"] == "wrapper" for c in poison_dlq["cases"] if (b := c.get("body"))), f"poison_dlq: no wrapper case for unpaired surrogate {esc!r}"

          print(f"✓ v1.6 sections agree with their reference oracles — {total} cases")
          PY

      - name: Results schema is valid and its example conforms
        run: |
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.load(open("schema/results.schema.json"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          example = json.load(open("schema/results.example.json"))
          errors = sorted(validator.iter_errors(example), key=lambda e: list(e.path))
          assert not errors, "results.example.json does not conform: " + "; ".join(e.message for e in errors)

          manifest = json.load(open("manifest.json"))
          version = open("CONFORMANCE_VERSION").read().strip()
          assert example["conformance_version"] == version, "results.example.json must use the current conformance_version"

          def case_ids(value, section, sub=None):
              # ADR-0032 section 2, "Case id": a case is its `name`, else its 0-based index
              # (`<section>#<index>` for a section-level case, bare `<index>` under a sub-key)
              def of(cases):
                  return [str(c["name"]) if isinstance(c, dict) and "name" in c else (f"{section}#{i}" if sub is None else str(i))
                          for i, c in enumerate(cases)]
              if isinstance(value, list):
                  return of(value)
              ids = []
              if isinstance(value.get("cases"), list):
                  ids += of(value["cases"])
              for key, item in value.items():
                  if key in ("description", "schema", "cases") or not isinstance(item, dict):
                      continue
                  if isinstance(item.get("cases"), list):
                      ids += [f"{key}/{i}" for i in case_ids(item["cases"], section, key)]
                  else:
                      ids.append(key)
              return ids

          sections = manifest["sections"]
          carried = set(example["bindings"])
          for name, results in example["sections"].items():
              assert name in sections, f"example section {name!r} is not in the manifest"
              scope = sections[name]["scope"]
              assert scope == "core" or scope in carried, f"example section {name!r} has scope {scope!r}, which the package does not carry"
              ids = set(case_ids(manifest[name], name))
              unknown = set(results) - ids
              assert not unknown, f"example section {name!r} has unknown case ids {sorted(unknown)}"
          for name, entry in sections.items():
              if entry["scope"] not in ("core", *carried):
                  assert name not in example["sections"], f"section {name!r} must be absent: binding {entry['scope']!r} is not carried"

          print(f"✓ results.schema.json is a valid 2020-12 schema; results.example.json conforms ({len(example['sections'])} sections)")
          PY

      - name: Release asset is reproducible and fetch.sh round-trips it
        run: |
          set -euo pipefail
          build_asset() {  # $1 = output dir; the same commands run in release.yml
            v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
            root="babelqueue-conformance-${v}"
            rm -rf "$1" stage
            mkdir -p "$1" "stage/${root}"
            cp -R CONFORMANCE_VERSION manifest.json schema fixtures LICENSE "stage/${root}/"
            find "stage/${root}" -type d -exec chmod 755 {} +
            find "stage/${root}" -type f -exec chmod 644 {} +
            tar --format=gnu --sort=name --mtime='2026-01-01 00:00:00 UTC' --owner=0 --group=0 --numeric-owner \
              -C stage -cf - "${root}" | gzip -n -9 > "$1/${root}.tar.gz"
            (cd "$1" && sha256sum "${root}.tar.gz" > SHA256SUMS)
          }
          build_asset dist-a
          build_asset dist-b
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          a="$(sha256sum dist-a/*.tar.gz | cut -d' ' -f1)"
          b="$(sha256sum dist-b/*.tar.gz | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "release asset is not deterministic"; exit 1; }
          v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
          tmp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/bq-fetched"
          rm -rf "$tmp"
          export BQ_CONFORMANCE_BASE_URL="file://$PWD/dist-a"
          ./fetch.sh "$v" "$tmp"
          ./fetch.sh --check "$v" "$tmp"
          diff -r -x LICENSE "$tmp" "stage/babelqueue-conformance-${v}"
          echo '{}' >> "$tmp/manifest.json"
          if ./fetch.sh --check "$v" "$tmp" > /dev/null 2>&1; then
            echo "fetch.sh --check must fail on a drifted vendor dir"; exit 1
          fi
          # a corrupted asset must be rejected by the checksum
          cp -R dist-a dist-bad
          printf 'x' >> "dist-bad/babelqueue-conformance-${v}.tar.gz"
          if BQ_CONFORMANCE_BASE_URL="file://$PWD/dist-bad" ./fetch.sh "$v" "$tmp-bad" > /dev/null 2>&1; then
            echo "fetch.sh must reject a corrupted asset"; exit 1
          fi
          echo "✓ release asset is reproducible ($a) and fetch.sh verifies, unpacks and compares it"
          rm -rf dist-a dist-b dist-bad stage "$tmp" "$tmp-bad"

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
