name: Release

# Runs on a v* tag. Re-runs every CI check, builds the deterministic release asset and
# its SHA256SUMS, and publishes both on a GitHub release. Never publishes an untested tag.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish the release asset
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches CONFORMANCE_VERSION and the manifest
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] \
            || { echo "tag ${GITHUB_REF_NAME} != v${v} (CONFORMANCE_VERSION)"; exit 1; }
          m="$(python3 -c 'import json; print(json.load(open("manifest.json"))["conformance_version"])')"
          [ "$m" = "$v" ] || { echo "manifest conformance_version ${m} != ${v}"; exit 1; }
          echo "✓ releasing conformance ${v}"

      # Deterministic: files are added in name order with a fixed mtime and root ownership,
      # and gzip is told not to record a name or timestamp. The same commit always yields
      # the same sha256. The tarball has a single root directory, babelqueue-conformance-<v>/.
      - name: Build the release asset and SHA256SUMS
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
          root="babelqueue-conformance-${v}"
          rm -rf dist stage
          mkdir -p dist "stage/${root}"
          cp -R CONFORMANCE_VERSION manifest.json schema fixtures LICENSE "stage/${root}/"
          find "stage/${root}" -type d -exec chmod 755 {} +
          find "stage/${root}" -type f -exec chmod 644 {} +
          tar --format=gnu --sort=name --mtime='2026-01-01 00:00:00 UTC' --owner=0 --group=0 --numeric-owner \
            -C stage -cf - "${root}" | gzip -n -9 > "dist/${root}.tar.gz"
          (cd dist && sha256sum "${root}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: The asset verifies and unpacks with fetch.sh
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
          export BQ_CONFORMANCE_BASE_URL="file://$PWD/dist"
          ./fetch.sh "$v" "$RUNNER_TEMP/fetched"
          ./fetch.sh --check "$v" "$RUNNER_TEMP/fetched"
          diff -r -x LICENSE "$RUNNER_TEMP/fetched" "stage/babelqueue-conformance-${v}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < CONFORMANCE_VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/babelqueue-conformance-${v}.tar.gz" dist/SHA256SUMS \
            --verify-tag \
            --title "Conformance ${v}" \
            --notes "BabelQueue cross-SDK conformance suite ${v}. Fetch and verify with \`fetch.sh ${v} <dest>\`; see the README."
